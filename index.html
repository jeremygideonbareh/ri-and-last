<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ri & Last · Handwoven Eri Silk from Khweng, Meghalaya</title>
    <meta
      name="description"
      content="Ri & Last is an Eri silk weaving and dyeing unit in Khweng, Ri-Bhoi, Meghalaya: handwoven Ryndia Jainsem, stoles, mufflers and shawls in indigenous designs and natural dyes. Gold Winner, Indian Responsible Tourism State Awards 2025."
    />
    <meta name="theme-color" content="#1d1712" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="preload" href="/fonts/zodiak-variable.woff2" as="font" type="font/woff2" crossorigin />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ri & Last · Handwoven Eri Silk" />
    <meta property="og:description" content="Eri silk Jainsem, stoles and shawls, woven slowly in Khweng, Meghalaya." />

    <script>
      // Motion switch, before the first paint: the visitor's choice wins,
      // otherwise follow what their system asks for.
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('rilast-motion')
        } catch (e) {}
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        document.documentElement.dataset.motion = saved || (reduce ? 'off' : 'on')
      })()
    </script>

    <!-- The loom: warp threads drop, coloured weft rows shuttle across and
         weave a panel, the counter runs to 100, and the cloth parts open. -->
    <style>
      #intro {
        position: fixed;
        inset: 0;
        z-index: 200;
        pointer-events: none;
      }
      #intro .half {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #1d1712;
        transition: transform 1.2s cubic-bezier(0.76, 0, 0.24, 1);
      }
      #intro .half.l {
        clip-path: inset(0 50% 0 0);
      }
      #intro .half.r {
        clip-path: inset(0 0 0 50%);
      }
      #intro .loom {
        position: relative;
        width: min(62vw, 340px);
        aspect-ratio: 3 / 4;
      }
      #intro .warp {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: space-between;
      }
      #intro .warp i {
        display: block;
        width: 1px;
        height: 100%;
        background: rgba(242, 235, 221, 0.45);
        transform: scaleY(0);
        transform-origin: top;
        animation: warp 0.7s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      #intro .weft {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column-reverse;
      }
      #intro .weft b {
        display: block;
        flex: 1;
        transform: scaleX(0);
        animation: weft 0.32s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        /* a woven look: tiny ribs across each row */
        background-image: repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.14) 0 1px, transparent 1px 6px);
      }
      #intro .weft b:nth-child(odd) {
        transform-origin: left;
      }
      #intro .weft b:nth-child(even) {
        transform-origin: right;
      }
      #intro .mark {
        position: absolute;
        inset: auto 0 -5.2rem;
        display: grid;
        justify-items: center;
        gap: 0.35rem;
        color: #f2ebdd;
        text-align: center;
      }
      #intro .count {
        font:
          400 clamp(40px, 7vw, 64px) / 1 'Zodiak',
          Georgia,
          serif;
        font-variant-numeric: tabular-nums;
        opacity: 0;
        transition: opacity 0.3s;
      }
      html.intro-type #intro .count {
        opacity: 1;
      }
      #intro .stage {
        font:
          500 11px/1 ui-monospace,
          monospace;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgba(242, 235, 221, 0.75);
        height: 12px;
      }
      #intro .name {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font:
          italic 400 clamp(34px, 7vw, 58px) / 1 'Zodiak',
          Georgia,
          serif;
        color: #f2ebdd;
        text-shadow: 0 2px 30px rgba(29, 23, 18, 0.6);
        clip-path: inset(0 100% 0 0);
        transition: clip-path 0.9s cubic-bezier(0.65, 0, 0.35, 1);
      }
      html.intro-named #intro .name {
        clip-path: inset(0 0 0 0);
      }
      @keyframes warp {
        to {
          transform: scaleY(1);
        }
      }
      @keyframes weft {
        to {
          transform: scaleX(1);
        }
      }
      html.intro-out #intro .half.l {
        transform: translateX(-100%);
      }
      html.intro-out #intro .half.r {
        transform: translateX(100%);
      }
      html.intro-gone #intro,
      html[data-motion='off'] #intro {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="intro" role="status" aria-label="Loading Ri & Last">
      <div class="half l"></div>
      <div class="half r"></div>
    </div>

    <div id="root"></div>

    <script>
      // Build the loom twice (one per half of the curtain), then weave.
      ;(function () {
        var html = document.documentElement
        if (html.dataset.motion === 'off') return
        var colours = ['#9e2b25', '#233a86', '#d9962b', '#c79ab8', '#f2ebdd', '#4f6b35', '#9e2b25', '#f2ebdd', '#233a86', '#c79ab8', '#d9962b', '#9e2b25', '#f2ebdd', '#4f6b35', '#233a86', '#c79ab8']
        var loom = '<div class="loom"><div class="warp">'
        for (var i = 0; i < 25; i++) loom += '<i style="animation-delay:' + (i * 0.018).toFixed(3) + 's"></i>'
        loom += '</div><div class="weft">'
        for (var j = 0; j < colours.length; j++)
          loom += '<b style="background-color:' + colours[j] + ';animation-delay:' + (0.55 + j * 0.085).toFixed(3) + 's"></b>'
        loom += '</div><div class="name">Ri &amp; Last</div><div class="mark"><div class="count">00</div><div class="stage">Spinning</div></div></div>'
        var halves = document.querySelectorAll('#intro .half')
        for (var h = 0; h < halves.length; h++) halves[h].innerHTML = loom
        var counts = document.querySelectorAll('#intro .count')
        var stages = document.querySelectorAll('#intro .stage')
        var words = ['Spinning', 'Dyeing', 'Weaving', 'Finishing']
        var start = 0
        var dur = 1900
        var counted = false
        function set(list, v) {
          for (var k = 0; k < list.length; k++) list[k].textContent = v
        }
        function tick(now) {
          if (!start) start = now
          var t = Math.min(1, (now - start) / dur)
          var e = 1 - Math.pow(1 - t, 3)
          set(counts, String(Math.round(e * 100)).padStart(2, '0'))
          set(stages, words[Math.min(words.length - 1, Math.floor(t * words.length))])
          if (t > 0.72) html.classList.add('intro-named')
          if (t < 1) requestAnimationFrame(tick)
          else {
            counted = true
            maybeOpen()
          }
        }
        var begun = false
        function begin() {
          if (begun) return
          begun = true
          html.classList.add('intro-type')
          requestAnimationFrame(tick)
        }
        if (document.fonts && document.fonts.load) document.fonts.load('400 40px Zodiak').then(begin, begin)
        else begin()
        setTimeout(begin, 900)
        var opened = false
        function open() {
          if (opened) return
          opened = true
          html.classList.add('intro-out')
          window.dispatchEvent(new Event('intro:out'))
          setTimeout(function () {
            html.classList.add('intro-gone')
          }, 1300)
        }
        function maybeOpen() {
          if (counted && html.classList.contains('app-ready')) setTimeout(open, 250)
        }
        window.addEventListener('app:ready', maybeOpen)
        setTimeout(open, 4600)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
